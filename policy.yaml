# OpenShell 0.1.4 policy for both HW2 agents and the MCP server (image isso-hw2:1,
# sandbox/Dockerfile). Every grant is explained in the design report (rubric A4).
version: 1
filesystem_policy:
  include_workdir: false          # never grant the working directory implicitly
  read_only:
    - /bin                        # system binaries
    - /usr                        # the Python interpreter (/usr/local/bin/python3.13) and libraries
    - /lib                        # shared libraries (/lib64 does not exist on arm64)
    - /etc                        # resolver, CA certificates, passwd for uid lookup
    - /proc                       # process information the interpreter reads
    - /dev/urandom                # randomness for TLS and hashing
    - /app                        # code, venv, schemas, configs, mcp.json (no keys, no labels)
    - /target/prepared            # the frozen, manifest-verified inputs only
  read_write:
    - /sandbox/work               # evidence packets, run output, per-item CodeAct scratch
    - /tmp                        # interpreter temporary files
    - /dev/null
# No grant for /target itself, /target/labels, /target/private, or any .git:
# they exist in the image, so a read is a permission denial, not a missing file.
landlock:
  compatibility: hard_requirement # refuse to start if Landlock cannot be enforced
network_policies:
  model_provider:
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce      # L7 enforcement (it defaults to audit)
        access: read-write        # the narrowest preset that allows the model call's POST
    binaries:
      - path: /usr/local/bin/python3.13   # the venv's python resolves here; its children inherit it
# The provider attachment (sandbox/openai.yaml) adds a second policy,
# _provider_openai, for the same endpoint and binary, and keeps the key outside.
