# OpenShell 0.1.4's providers/openai.yaml, with `binaries` changed to the image's
# Python (the only process that should reach the provider). Import with:
#   openshell provider profile import -f sandbox/openai.yaml --global
id: openai
display_name: OpenAI
description: OpenAI inference API
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/python3.13]
